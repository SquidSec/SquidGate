# .github/security-scan.yml
# Default strict security policy for PRs
version: 1

llm:
  provider: custom   # openai | anthropic | azure | google | custom
  model: grok-build-0.1
  # For xAI Grok: base url is passed via action input or here if using openai provider with custom endpoint


policy:
  block_on: high            # critical | high | medium | low | none
  min_confidence: medium
  categories:
    secrets: true
    injection: true
    authn_authz: true
    cryptography: true
    insecure_deserialization: true
    path_traversal: true
    ssrf: true
    xss: true
    csrf: true
    supply_chain: true
    hardcoded_credentials: true
    dangerous_functions: true
    misconfiguration: true
  custom_rules: []

context:
  lines_before: 30
  lines_after: 30
  max_files: 50
  max_diff_bytes: 500000

output:
  comment_on_pr: true
  annotate_lines: true
  fail_on_error: true
