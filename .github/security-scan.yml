# .github/security-scan.yml
# Default strict security policy for PRs
version: 1

llm:
  provider: openai   # openai | anthropic | azure | google | custom
  model: gpt-4o      # or claude-3-5-sonnet-20241022, gemini-1.5-pro, etc.

policy:
  block_on: high            # critical | high | medium | low | none
  min_confidence: medium
  categories:
    secrets: true
    injection: true
    authn_authz: true
    cryptography: true
    insecure_deserialization: true
    path_traversal: true
    ssrf: true
    xss: true
    csrf: true
    supply_chain: true
    hardcoded_credentials: true
    dangerous_functions: true
    misconfiguration: true
  custom_rules: []

context:
  lines_before: 30
  lines_after: 30
  max_files: 50
  max_diff_bytes: 500000

output:
  comment_on_pr: true
  annotate_lines: true
  fail_on_error: true
