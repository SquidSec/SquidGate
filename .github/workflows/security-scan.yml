name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run security-scan
        uses: ./   # for local testing; in real use: your-org/security-scan@v1
        with:
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-provider: custom
          llm-model: grok-build-0.1
          llm-base-url: https://api.x.ai/v1
          # github-token: ${{ secrets.GITHUB_TOKEN }}  # default is sufficient
          # block-on: high
          # To relax for testing: block-on: none

