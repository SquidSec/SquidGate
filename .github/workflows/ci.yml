name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted: the self-hosted pool is not currently acquiring jobs, and
    # GitHub-hosted runners keep fork PR code off private infrastructure.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Ensure dist is up to date
        run: |
          git diff --exit-code dist/ || {
            echo "::error::dist/ is stale. Run npm run build and commit dist/"
            exit 1
          }
