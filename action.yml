name: 'SquidGate'
description: 'LLM-powered PR security gate. Scans diffs for secrets, injection, and OWASP issues — fails the check to block merge.'
author: 'SquidSec'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  llm-api-key:
    description: 'LLM provider API key (store as a repository secret, e.g. secrets.LLM_API_KEY)'
    required: true
  github-token:
    description: 'GitHub token with checks:write, pull-requests:write, and contents:read'
    required: true
    default: ${{ github.token }}
  config-path:
    description: 'Path to SquidGate config YAML'
    required: false
    default: '.github/squidgate.yml'
  llm-provider:
    description: 'LLM provider: openai | anthropic | azure | google | custom'
    required: false
  llm-model:
    description: 'Model id (e.g. gpt-4o, claude-3-5-sonnet, grok-build-0.1)'
    required: false
  llm-base-url:
    description: 'Base URL for Azure, xAI, Ollama, or other OpenAI-compatible endpoints'
    required: false
  block-on:
    description: 'Minimum severity that fails the check: critical | high | medium | low | none'
    required: false

outputs:
  findings-count:
    description: 'Number of findings after confidence filtering'
  blocking-findings-count:
    description: 'Number of findings at or above block_on severity'
  conclusion:
    description: 'Check conclusion: success | failure | neutral'

runs:
  using: 'node20'
  main: 'dist/index.js'
